[package]
name = "conditional-lock-hash-vectors"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = { version = "=3.0.0", default-features = false }

[dev-dependencies]
# Keep the VM on the same Agave release as the tested SBF build tools.
agave-syscalls = "=3.1.14"
litesvm = "=0.9.1"
hex = "=0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-address = "2.0"
solana-instruction = "~3.1"
solana-instruction-error = "2.0"
solana-keypair = "~3.1"
solana-message = "~3.0"
solana-signer = "~3.0"
solana-transaction = { version = "~3.0", features = ["bincode"] }
solana-transaction-error = "~3.0"

[lints.rust]
# The SDK entrypoint macro expands these Solana-specific cfgs in this crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
